<!DOCTYPE html>
<html>
  <!-- Gallery Modal -->
<div id="galleryModal"
  class="fixed inset-0 z-[9999] hidden items-center justify-center"
  style="background: rgba(0,0,0,0.92); backdrop-filter: blur(6px);">

  <!-- Close button -->
  <button onclick="closeGallery()"
    class="absolute top-6 right-6 text-white text-2xl"
    aria-label="Close">
    ✕
  </button>

  <!-- Left arrow -->
  <button onclick="prevImage()"
    class="absolute left-6 text-white text-3xl px-3">
    ‹
  </button>

  <!-- Image -->
  <div class="max-w-5xl w-full px-6">
    <img id="galleryImage"
      src=""
      class="w-full max-h-[85vh] object-contain rounded-lg shadow-2xl"
      alt="Gallery image">
  </div>

  <!-- Right arrow -->
  <button onclick="nextImage()"
    class="absolute right-6 text-white text-3xl px-3">
    ›
  </button>
</div>

<script>
const galleries = {
  panda: [
    "/src/images/Pan1.jpg",
    "/src/images/Pan2.jpg",
    "/src/images/Pan3.jpg",
    "/src/images/Pan4.jpg"
  ],
  ngwenya: [
    "/src/images/NN1.jpg",
    "/src/images/NN2.jpg",
    "/src/images/NN3.jpg",
    "/src/images/NN4.jpg"
  ],
  mandlovu: [
    "/src/images/MaN1.jpg",
    "/src/images/MaN2.jpg",
    "/src/images/MaN3.jpg",
    "/src/images/MaN4.jpg"
  ],
  tshieng: [
    "/src/images/Tsh1.jpg",
    "/src/images/Tsh2.jpg",
    "/src/images/Tsh3.jpg",
    "/src/images/Tsh4.jpg"
  ],
  tolo: [
    "/src/images/TB1.jpg",
    "/src/images/TB2.jpg",
    "/src/images/TB3.jpg",
    "/src/images/TB4.jpg"
  ],
  xola: [
    "/src/images/Xol1.jpg",
    "/src/images/Xol2.jpg",
    "/src/images/Xol3.jpg",
    "/src/images/Xol4.jpg"
  ],
  lekgolokwe: [
    "/src/images/LKG1.jpg",
    "/src/images/LKG2.jpg",
    "/src/images/LKG3.jpg",
    "/src/images/LKG4.jpg"
  ],
  letlotlo: [
    "/src/images/Let1.jpg",
    "/src/images/Let2.jpg",
    "/src/images/Let3.jpg",
    "/src/images/Let4.jpg"
  ],
  phuleng: [
    "/src/images/Phu1.jpeg",
    "/src/images/Phu2.jpeg",
    "/src/images/Phu3.jpeg",
    "/src/images/Phu4.jpeg"
  ]
};

let currentGallery = [];
let currentIndex = 0;

/* OPEN GALLERY */
document.querySelectorAll("[data-gallery]").forEach(el => {
  el.addEventListener("click", (e) => {
    const key = e.currentTarget.dataset.gallery;

    currentGallery = galleries[key] || [];
    currentIndex = parseInt(e.currentTarget.dataset.index || 0);

    if (!currentGallery.length) return;

    openGallery();
  });
});

function openGallery() {
  document.getElementById("galleryModal").classList.remove("hidden");
  document.getElementById("galleryModal").classList.add("flex");
  document.body.style.overflow = "hidden";
  updateImage();
}

function closeGallery() {
  document.getElementById("galleryModal").classList.add("hidden");
  document.getElementById("galleryModal").classList.remove("flex");
  document.body.style.overflow = "auto";
}

function updateImage() {
  document.getElementById("galleryImage").src =
    currentGallery[currentIndex];
}

function nextImage() {
  currentIndex = (currentIndex + 1) % currentGallery.length;
  updateImage();
}

function prevImage() {
  currentIndex =
    (currentIndex - 1 + currentGallery.length) % currentGallery.length;
  updateImage();
}

/* Keyboard controls */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeGallery();
  if (e.key === "ArrowRight") nextImage();
  if (e.key === "ArrowLeft") prevImage();
});

/* Optional: preload images for smoother UX */
Object.values(galleries).flat().forEach(src => {
  const img = new Image();
  img.src = src;
});
</script>
</html>
