<!DOCTYPE html>
<html>

  <!-- Contact Section -->
  <section id="contact" class="px-6 md:px-12" style="padding: 120px 0 140px; background: #FAF8F5;">

    <div class="max-w-6xl mx-auto">

      <!-- Heading -->
      <div class="text-center mb-24">
        <div class="font-sans-body text-xs tracking-[0.3em] uppercase mb-6" style="color: #C9A96E;">
          Get In Touch
        </div>

        <h2 class="font-serif-display text-4xl md:text-5xl lg:text-6xl font-normal mb-8" style="color: #1A1A1A;">
          Begin Your Stay
        </h2>

        <div class="thin-divider mx-auto"></div>
      </div>

      <!-- GRID -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-stretch">

        <!-- 🗺️ LOCATION HERO CARD -->
        <div class="rounded-3xl overflow-hidden border border-[#E7E1D8] bg-white shadow-sm">

          <!-- Header -->
          <div class="p-6 border-b border-[#E7E1D8]">
            <div class="flex items-center gap-3">
              <i data-lucide="map-pin" class="w-4 h-4 text-[#C9A96E]"></i>
              <h3 class="text-xs tracking-[0.25em] uppercase text-[#1A1A1A]">
                Location
              </h3>
            </div>
          </div>

          <!-- Address -->
          <div class="p-6">
            <p class="text-sm leading-relaxed text-[#1A1A1A] font-light">
              1 King Haakon Road<br>
              Oslo Beach<br>
              Port Shepstone<br>
              Ugu District Municipality<br>
              KwaZulu Natal<br>
              South Africa, 4240
            </p>
          </div>

          <!-- Map -->
          <div class="h-[420px]">
            <iframe
              src="https://www.google.com/maps?q=1%20King%20Haakon%20Rd%2C%20Oslo%20Beach%2C%20Port%20Shepstone%2C%204240&output=embed"
              class="w-full h-full"
              style="border:0;"
              loading="lazy">
            </iframe>
          </div>
        </div>

        <!-- 📇 CONTACT STACK -->
        <div class="space-y-6">

          <!-- EMAIL -->
          <div class="rounded-2xl border border-[#E7E1D8] bg-white p-6 shadow-sm hover:shadow-md transition">
            <div class="flex items-center gap-3 mb-4">
              <i data-lucide="mail" class="w-4 h-4 text-[#C9A96E]"></i>
              <h3 class="text-xs tracking-[0.25em] uppercase text-[#1A1A1A]">
                Email
              </h3>
            </div>

            <a href="mailto:lavue.portshepstone@gmail.com"
              class="text-sm font-light text-[#A89F94] hover:text-[#C9A96E] transition">
              lavue.portshepstone@gmail.com
            </a>
          </div>

          <!-- PHONE -->
          <div class="rounded-2xl border border-[#E7E1D8] bg-white p-6 shadow-sm hover:shadow-md transition">
            <div class="flex items-center gap-3 mb-4">
              <i data-lucide="phone" class="w-4 h-4 text-[#C9A96E]"></i>
              <h3 class="text-xs tracking-[0.25em] uppercase text-[#1A1A1A]">
                Telephone
              </h3>
            </div>

            <a href="tel:+27761632064"
              class="text-sm font-light text-[#A89F94] hover:text-[#C9A96E] transition">
              +27 76 163 2064
            </a>
          </div>

          <!-- SOCIAL -->
          <div class="rounded-2xl border border-[#E7E1D8] bg-white p-6 shadow-sm hover:shadow-md transition">

            <div class="text-xs tracking-[0.25em] uppercase text-[#1A1A1A] mb-4">
              Follow
            </div>

            <div class="flex gap-6">
              <a href="https://www.instagram.com/lavue_nps/"
                target="_blank"
                class="text-[#A89F94] hover:text-[#C9A96E] transition">
                <i data-lucide="instagram" class="w-5 h-5"></i>
              </a>

              <a href="https://www.facebook.com/profile.php?id="
                target="_blank"
                class="text-[#A89F94] hover:text-[#C9A96E] transition">
                <i data-lucide="facebook" class="w-5 h-5"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</html>
