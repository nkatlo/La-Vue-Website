<!DOCTYPE html>
<html>

  <!-- Gallery Section -->
  <section id="gallery" class="px-6 md:px-12" style="padding-top: 120px; padding-bottom: 140px;">
    <div class="max-w-6xl mx-auto">
      <div class="reveal text-center mb-24">
        <div class="font-sans-body text-xs tracking-[0.3em] uppercase mb-8" style="color: #C9A96E;">
          Gallery
        </div>
        <h2 class="font-serif-display text-3xl md:text-4xl lg:text-5xl font-normal mb-8" style="color: #1A1A1A;">
          Moments of Beauty
        </h2>
        <div class="thin-divider mx-auto"></div>
      </div>
    
      <!-- Minimalist gallery grid -->
      <div class="space-y-6 md:space-y-8">

        <!-- Row 1: Full-width large image -->
        <div class="reveal gallery-item-minimal group overflow-hidden rounded-lg" style="aspect-ratio: 5/2;">

          <img 
              src="/src/images/ocean_horizon.jpeg" 
              alt="Ocean Horizon from La Vue Port Shepstone"
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
              loading="lazy"
            />

            <div class="gallery-overlay-minimal"></div>

            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-center">
              <p class="font-sans text-xs tracking-[0.25em] uppercase text-[#FAF8F5] opacity-70">
                OCEAN HORIZON
              </p>
            </div>

          <div class="gallery-overlay-minimal"></div>
        </div>

        <!-- Row 2: Two equal images -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">

          <div class="reveal gallery-item-minimal group overflow-hidden rounded-lg" style="aspect-ratio: 1.2/1;">

            <img 
              src="/src/images/interior_details.jpg" 
              alt="Interior Details from La Vue Port Shepstone"
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
              loading="lazy"
            />

            <div class="gallery-overlay-minimal"></div>

            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-center">
              <p class="font-sans text-xs tracking-[0.25em] uppercase text-[#FAF8F5] opacity-70">
                INTERIOR DETAILS
              </p>
            </div>
            
            <div class="gallery-overlay-minimal"></div>
          </div>

          <div class="reveal gallery-item-minimal group overflow-hidden rounded-lg" style="aspect-ratio: 1.2/1;">
            <img 
              src="/src/images/golden_hour.jpg" 
              alt="Golden hour from La Vue Port Shepstone"
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
              loading="lazy"
            />

            <div class="gallery-overlay-minimal"></div>

            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-center">
              <p class="font-sans text-xs tracking-[0.25em] uppercase text-[#FAF8F5] opacity-70">
                GOLDEN HOUR
              </p>
            </div>

            <div class="gallery-overlay-minimal"></div>
          </div>
        </div> 

        <!-- Row 3: Three images -->

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8">

          <div class="reveal gallery-item-minimal group overflow-hidden rounded-lg" style="aspect-ratio: 1;">

            <img 
              src="/src/images/living_space.jpg" 
              alt="Living Space from La Vue Port Shepstone"
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
              loading="lazy"
            />

            <div class="gallery-overlay-minimal"></div>

            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-center">
              <p class="font-sans text-xs tracking-[0.25em] uppercase text-[#FAF8F5] opacity-70">
                LIVING SPACE
              </p>
            </div>

            <div class="gallery-overlay-minimal"></div>
          </div>

          <div class="reveal gallery-item-minimal group overflow-hidden rounded-lg" style="aspect-ratio: 1;">

            <img 
              src="/src/images/ocean_view.jpg" 
              alt="OCean View from La Vue Port Shepstone"
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
              loading="lazy"
            />

            <div class="gallery-overlay-minimal"></div>

            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-center">
              <p class="font-sans text-xs tracking-[0.25em] uppercase text-[#FAF8F5] opacity-70">
                OCEAN VIEW
              </p>
            </div>

            <div class="gallery-overlay-minimal"></div>
          </div>

          <div class="reveal gallery-item-minimal group overflow-hidden rounded-lg" style="aspect-ratio: 1;">

            <img 
              src="/src/images/calm_spaces.jpg" 
              alt="calm Spaces from La Vue Port Shepstone"
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
              loading="lazy"
            />

            <div class="gallery-overlay-minimal"></div>

            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-center">
              <p class="font-sans text-xs tracking-[0.25em] uppercase text-[#FAF8F5] opacity-70">
                CALM SPACES
              </p>
            </div>

            <div class="gallery-overlay-minimal"></div>
          </div>
        </div>
     
        <!-- Row 4: Wide and tall asymmetric layout -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8 auto-rows-[300px]">
        <!--<div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8">-->

          <div class="reveal gallery-item-minimal group overflow-hidden rounded-lg md:col-span-2 md:row-span-2 h-full">
          <!--<div class="reveal gallery-item-minimal group overflow-hidden rounded-lg md:col-span-2" style="aspect-ratio: 2.5/1;">-->
            <img 
              src="/src/images/serenity_light.jpg" 
              alt="Serenity & Light from La Vue Port Shepstone"
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
              loading="lazy"
            />

            <div class="gallery-overlay-minimal"></div>

            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-center">
              <p class="font-sans text-xs tracking-[0.25em] uppercase text-[#FAF8F5] opacity-70">
                SERENITY &amp; LIGHT
              </p>
            </div>

            <div class="gallery-overlay-minimal"></div>
          </div>

          <div class="reveal gallery-item-minimal group overflow-hidden rounded-lg md:row-span-2 h-full">
          <!--<div class="reveal gallery-item-minimal group overflow-hidden rounded-lg md:row-span-2" style="aspect-ratio: 0.8/1;">-->

            <img 
              src="/src/images/hallway.jpg" 
              alt="Hallway from La Vue Port Shepstone"
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
              loading="lazy"
            />

            <div class="gallery-overlay-minimal"></div>

            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-center">
              <p class="font-sans text-xs tracking-[0.25em] uppercase text-[#FAF8F5] opacity-70">
                HALLWAY
              </p>
            </div>

            <div class="gallery-overlay-minimal"></div>   
          </div>
        </div>
        
        <!-- Row 5: Bottom complementary image -->
        <div class="reveal gallery-item-minimal group overflow-hidden rounded-lg" style="aspect-ratio: 5/2;">
          
          <img 
              src="/src/images/twilight_moments.jpg" 
              alt="Twilight Moments from La Vue Port Shepstone"
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
              loading="lazy"
            />

            <div class="gallery-overlay-minimal"></div>

            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-center">
              <p class="font-sans text-xs tracking-[0.25em] uppercase text-[#FAF8F5] opacity-70">
                TWILIGHT MOMENTS
              </p>
            </div>

          <div class="gallery-overlay-minimal"></div>
        </div>
      </div>
    </div>
  </section>
  
  <!-- Divider -->
  <div class="max-w-7xl mx-auto px-6 md:px-12">
    <div style="height:1px; background: rgba(168,159,148,0.2);"></div>
  </div>
</html>
